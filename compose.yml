# THE infrastructure contract. Local, CI, and prod all use this exact file.
# `docker compose up` builds and runs the same image everywhere.
#
# All env vars are read from `.env` (Docker Compose's default) via ${VAR}
# substitution. Locally: create a `.env` file. Dokploy: set vars in the UI
# (it creates `.env` automatically). CI: export vars in the runner.
#
# No host-port bindings: Dokploy's Traefik routes amindhou.com -> app:3000
# via the domain config. For local use, add `ports: ["3000:3000"]` to the
# app service in a local-only override, or access via `docker compose exec`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Client analytics vars are inlined at build time (see Dockerfile). Dokploy
      # writes these into .env; compose substitutes them into the build args so
      # the browser bundle actually carries the PostHog key + GA id.
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
      NODE_ENV: production
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Non-secret UseSend Resend-compat API base. The resend SDK appends
      # /emails, so this MUST include /api/v1; defaulted here (not left to an
      # optional .env line) so a missing value can't silently fall back to the
      # SDK default (Resend cloud) and drop every lead email.
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://usesend.devino.ca/api/v1}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GA4_SERVICE_ACCOUNT_KEY: ${GA4_SERVICE_ACCOUNT_KEY:-}
      GA4_PROPERTY_SHORTY: ${GA4_PROPERTY_SHORTY:-}
      GA4_PROPERTY_UNOTES: ${GA4_PROPERTY_UNOTES:-}
      GA4_PROPERTY_CARAMEL: ${GA4_PROPERTY_CARAMEL:-}
      GA4_PROPERTY_UPUP: ${GA4_PROPERTY_UPUP:-}
      GA4_PROPERTY_GETITDONE: ${GA4_PROPERTY_GETITDONE:-}
      # Emergency escape hatch for the strict env presence gate (src/env.ts
      # validateRequiredEnv). Left unset in normal operation; set to the exact
      # sentinel value in the Dokploy env ONLY to deliberately boot past a
      # missing required var. Wired here so the override can actually reach the
      # container -- without this line it would be silently unreachable in prod.
      DANGEROUSLY_BOOT_WITH_MISSING_REQUIRED_ENV_AND_SKIP_VALIDATION: ${DANGEROUSLY_BOOT_WITH_MISSING_REQUIRED_ENV_AND_SKIP_VALIDATION:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Brings `app` back after a HOST REBOOT. Dokploy rewrites this file at deploy
  # time and attaches `app` (the service with a domain) to the external
  # `dokploy-network`, a Swarm-scoped attachable overlay. At boot the Docker
  # daemon restores `db` (default network only) but cannot attach that overlay
  # yet, so `app` stays `Exited (255)` and `restart: unless-stopped` never
  # retries a failed start (seen 2026-10-16: down 2 h with no new log lines).
  # This service has NO networks (`network_mode: none`), so like `db` it comes
  # back at boot; every ~25 s it runs `docker start` on this project's `app`
  # container, and ONLY when that container is exited with code 255, the
  # daemon-shutdown signature. A deploy, `compose stop` or SIGTERM exits 0 or
  # 143, so a deliberate stop is never undone.
  #
  # Security trade-off: /var/run/docker.sock is root-equivalent on the host. It
  # is mitigated by `network_mode: none` (nothing can reach this container), no
  # ports, no env secrets, a read-only rootfs with every capability dropped, and
  # a fixed command that only ever runs `docker start` on this project's `app`.
  # See DESIGN.md's register entry on the docker.sock mount before changing it.
  watchdog:
    image: docker:29-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
    restart: unless-stopped
    network_mode: none
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    # `$$` is compose's escape for a literal `$` (it is not interpolated here).
    # The project name comes from this container's own compose label, so the
    # same file works under any project name (Dokploy's, or a local one).
    # Every docker call is allowed to fail: it logs and the loop carries on.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        log() { echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) watchdog: $$*"; }
        project=""
        while true; do
          if [ -z "$$project" ]; then
            project=$$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$$HOSTNAME" 2>/dev/null) || project=""
            [ -n "$$project" ] && log "guarding service=app in project=$$project"
          fi
          if [ -n "$$project" ]; then
            if ids=$$(docker ps -aq --filter "label=com.docker.compose.project=$$project" --filter "label=com.docker.compose.service=app" --filter "label=com.docker.compose.oneoff=False" --filter status=exited --filter exited=255 2>&1); then
              for id in $$ids; do
                if out=$$(docker start "$$id" 2>&1); then
                  log "started $$id (exited 255)"
                else
                  log "start of $$id failed: $$out"
                fi
              done
            else
              log "docker ps failed: $$ids"
            fi
          fi
          sleep 25
        done

volumes:
  db-data:
