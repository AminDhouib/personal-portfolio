ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Security pins for transitive dependencies whose parents hold them below the fixed version.
# Each one stays inside the major its parent expects unless its comment says why it crosses
# one. Drop an entry once the parent ships the fix itself (pnpm audit without the entry
# stays clean).
overrides:
  # GHSA-cg2g-xh64-v4q7 (critical), GHSA-mrv2-3pqr-j5jr (high). DOMPurify <=3.4.16 (transitive,
  # the lock resolved 3.4.16); 3.4.17 is the first fixed release, same major.
  "dompurify@<3.4.17": "^3.4.17"
  # GHSA-rxp7-6hxx-x8q5 (moderate). ip-address 10.7.3 via express-rate-limit (prod, through
  # @copilotkit/runtime > @modelcontextprotocol/sdk) and socks (dev, @lhci/cli); 10.7.4 is the
  # first fixed release, same major.
  "ip-address@<10.7.4": "^10.7.4"
  # GHSA-866g-f22w-33x8 (low). @ai-sdk/google-vertex 3.0.x (via @copilotkit/runtime) pins
  # 3.0.23. 3.0.30 is the newest fixed 3.0.x without undici ^5, whose 5.x line has
  # advisories that are only fixed in 6.x.
  "@ai-sdk/provider-utils@>=3.0.0 <3.0.28": "3.0.30"
  # GHSA-866g-f22w-33x8 (low). @ai-sdk/mcp (via @copilotkit/runtime) pins 4.0.22; 4.0.57 is
  # the version @ai-sdk/openai already uses.
  "@ai-sdk/provider-utils@>=4.0.0 <4.0.33": "4.0.57"
  # GHSA-4mjr-xmp4-gh2g, GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx (moderate). Added for
  # express 4 under @lhci/cli (dev), which pins ~6.14.0; the range also lifts the prod copies
  # under express 5 and body-parser 2. GHSA-6pq8-jhm2-2vcw (moderate) is fixed in 6.16.1, the
  # floor now (the lock resolved 6.16.0); same major.
  "qs@>=6.11.1 <6.16.1": "^6.16.1"
  # GHSA-27r3-jxmh-p828 (high). body-parser 1.20.8 (the lock resolved it) comes in through
  # express 4.22.1 under @lhci/cli (dev only); 1.20.9 is the first fixed release, same major
  # (express 4 expects ^1).
  "body-parser@>=1.0.0 <1.20.9": "^1.20.9"
  # GHSA-27r3-jxmh-p828 (high). body-parser 2.3.0 (the lock resolved it) comes in through
  # express 5.2.1 (prod: @modelcontextprotocol/sdk, reached via @copilotkit/react-core >
  # @copilotkit/mcp-apps-renderer, and @copilotkit/runtime itself); 2.4.0 is the first fixed
  # release, same major (express 5 expects ^2).
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  # GHSA-xjj6-f33q-929c, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm (high), GHSA-4qv8-2p9j-2685,
  # GHSA-9fm3-97px-rjf6 (moderate). undici 6.29.0 (the lock resolved it) comes in through
  # @ai-sdk/provider-utils 4.0.57 and 4.0.62 (under @ai-sdk/openai and @ai-sdk/mcp); 6.29.1 is
  # the first fixed release, same major. The selector stops at 6.x, so the 8.x line and
  # undici-types stay as they are.
  "undici@>=6.0.0 <6.29.1": "^6.29.1"
  # GHSA-rj75-hqrm-r3gf (moderate). Crosses a major, scoped to its only consumer:
  # @tailwindcss/typography (0.5.19 and 0.5.20 alike) pins 6.0.10, and the fix is 7.1.6.
  # 7.0's one breaking change makes inserting nodes while iterating safe; the compiled
  # site CSS is byte-identical under 7.1.6.
  "@tailwindcss/typography>postcss-selector-parser": "^7.1.6"
  # GHSA-238p-pmpm-9mq7 (low): prototype pollution can bypass the trust setting, fixed in
  # 0.18.2. 0.18.3 is the smallest fixed release and keeps katex's own dependencies as they
  # are; later 0.18.x pulls commander 15, and 0.18.11 is deprecated upstream. Crosses a
  # pre-1.0 minor (0.18 prefixes the generated CSS classes). @copilotkit/react-core (its
  # latest, 1.79.1) and streamdown (rehype-katex, remark-math, mermaid) all pin ^0.16, so no
  # parent update reaches the fix.
  "katex@>=0.11.0 <0.18.2": "0.18.3"
  # GHSA-w5hq-g745-h8pq (moderate). Crosses a major, scoped to its two consumers:
  # @langchain/langgraph 1.2.7 and @langchain/langgraph-checkpoint 1.0.1 (via
  # @copilotkit/runtime > @ag-ui/langgraph > langchain 1.3.0) pin ^10.0.0. They import only
  # v4, v5, v6 and validate, which 11.x keeps with the same signatures and a CommonJS build.
  # langgraph 1.5 and checkpoint 1.2 drop uuid altogether, but no parent update reaches them.
  "@langchain/langgraph>uuid": "^11.1.1"
  "@langchain/langgraph-checkpoint>uuid": "^11.1.1"
  # The rest of this block is dev only, all under @lhci/cli 0.15.1 (the latest), and each
  # entry crosses a major its parent pins, scoped to that one parent.
  # GHSA-ph9p-34f9-6g65 (high), GHSA-52f5-9888-hmc6 (low), GHSA-7c78-jf6q-g5cm (high, fixed in
  # 0.2.7, the floor now). tmp 0.2.x keeps the fileSync and
  # tmpNameSync calls these parents make; 0.2.4+ only refuses a `dir` outside the temp
  # directory, and neither parent passes one. lhci uses tmp only in `lhci open`,
  # external-editor only in the `lhci wizard` prompt.
  "@lhci/cli>tmp": "^0.2.7"
  "external-editor>tmp": "^0.2.7"
  # GHSA-w5hq-g745-h8pq (moderate). lhci collect calls uuid.v4() only; 11.x still ships the
  # CommonJS build lhci requires.
  "@lhci/cli>uuid": "^11.1.1"
  # GHSA-c475-qrg2-pj4r (high) and GHSA-5rfr-xx34-2xxv. get-uri (proxy-agent's PAC loader)
  # pins ^5.3.1, even in its latest release. 6.0's one breaking change refuses an FTP
  # server's separate transfer host by default.
  "get-uri>basic-ftp": "^6.2.2"
  # GHSA-7mx3-vvmw-hjmv (high): mergeDeep prototype pollution, fixed in 12.0.1; GHSA-c4qx-w738-7hr3
  # (high), fixed in 12.0.2, which is the floor now. Crosses a
  # major, and the whole chain is under @copilotkit/runtime > graphql-yoga (5.20.0 pins ^10,
  # even 5.24.2 only reaches ^11) plus @graphql-tools/executor, merge and schema (^11).
  # 12.x keeps every export those parents import and only swaps @whatwg-node/promise-helpers
  # to 2.x; the chat route is the only consumer.
  "@graphql-tools/utils@<12.0.2": "^12.0.2"
  # GHSA-x8rm-f576-gq67 (high): PhoneNumber scalar ReDoS, fixed only in 2.0.1. graphql-scalars
  # 1.25.0 (the lock resolved it) comes in through @copilotkit/runtime 1.79.1 and, as a peer,
  # type-graphql 2.0.0-rc.1 (^1.22.4), today its only two consumers; crosses a major. The
  # range selector is not parent-scoped, so any new consumer of graphql-scalars 1.x also gets
  # 2.x: recheck its imports against this proof before adding one. The 2.0.0 breaking changes are dropping graphql-js below 16 (the lock
  # has 16.13.2) and Node 20 (.nvmrc and the Dockerfile are on 22). Compared against the
  # 1.25.0 build, 2.0.1 ships the same files and the same 285 CommonJS exports, with the same
  # "type": "module" plus cjs/ esm/ export map; only the PhoneNumber scalar and error.js
  # differ, and the JSON, JSONObject, DateTimeISO and Timestamp scalars are byte-identical.
  # Those four are everything the parents import: runtime takes GraphQLJSON and
  # GraphQLJSONObject, type-graphql takes GraphQLTimestamp and GraphQLDateTimeISO.
  "graphql-scalars@<2.0.1": "^2.0.1"
  # GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv (high): extract-zip 2.0.1 is the last release
  # and has no patch. It was only reached through puppeteer-core 24 > @puppeteer/browsers 2.x;
  # puppeteer-core 25 pins @puppeteer/browsers 3.x, which unpacks with modern-tar instead.
  # Crosses a major, scoped to lighthouse (under @lhci/cli, dev only). lighthouse calls
  # puppeteer.connect({browserURL}) only, in its navigation runner, and never launches or
  # downloads a browser through puppeteer.
  "lighthouse>puppeteer-core": "25.13.0"

# The one documented exception to `pnpm audit --audit-level=high` (the CI dependency-audit
# job). GHSA-vfj7-8cjw-p6xm (high): braces <=3.0.3 stack exhaustion on deeply nested
# patterns, no patched release exists. Dev only: it is reached through
# eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch > braces, which
# globs this repo's own patterns, never untrusted input. Drop this entry when a patched
# braces ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
