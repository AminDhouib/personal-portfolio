name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier format check
        run: pnpm format:check

      - name: Oxlint (fast correctness)
        run: pnpm exec oxlint -c .oxlintrc.json .

      - name: ESLint (type-aware + custom rules)
        run: pnpm lint

      - name: TypeScript strict check (tsc --noEmit)
        run: pnpm typecheck

      - name: Env schema drift check (env.ts vs .env.example)
        run: node scripts/check-env-drift.mjs

      - name: "Action pin check (uses: must be a commit SHA)"
        run: node scripts/check-action-pins.mjs

      - name: Root-file allowlist check
        run: node scripts/check-root-files.mjs

      - name: Knip (dead files, exports, dependencies)
        run: pnpm exec knip

      - name: Vitest unit + integration tests
        run: pnpm test:coverage

      - name: Next.js production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  lighthouse:
    name: Lighthouse (all public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Assemble and boot the standalone bundle the same way the Dockerfile
      # does. CI has no secrets, so the boot uses the env gate's designed
      # loud bypass sentinel — Lighthouse audits rendered markup, not the
      # integrations behind the missing vars (DB-backed API calls 500, which
      # only dings the warn-level best-practices category).
      - name: Boot standalone server
        env:
          DANGEROUSLY_BOOT_WITH_MISSING_REQUIRED_ENV_AND_SKIP_VALIDATION: I_UNDERSTAND_THIS_MAY_CRASH_CORRUPT_DATA_OR_EXPOSE_BROKEN_BEHAVIOR
        run: |
          SERVER_JS=$(find .next/standalone -name server.js -not -path "*/node_modules/*" | head -1)
          APP_DIR=$(dirname "$SERVER_JS")
          mkdir -p "$APP_DIR/.next"
          [ -d "$APP_DIR/.next/static" ] || cp -r .next/static "$APP_DIR/.next/static"
          [ -d "$APP_DIR/public" ] || cp -r public "$APP_DIR/public"
          PORT=3000 HOSTNAME=127.0.0.1 NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 node "$SERVER_JS" &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health

      - name: Lighthouse audit (URL list derived from sitemap.xml)
        run: node scripts/run-lighthouse.mjs http://localhost:3000

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  deploy:
    name: Deploy to Dokploy
    needs: [lint-and-test, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deploy secrets
        id: check
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::deploy secrets not configured; this push did NOT deploy via CI (Dokploy autoDeploy may still fire independently)"
          fi

      - name: Connect to Tailscale
        if: steps.check.outputs.enabled == 'true'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          curl -sf -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"hnV_k4WYHOmodXzsvQeDk"}'
