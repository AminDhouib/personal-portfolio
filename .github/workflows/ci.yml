name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "audit/**"
      - LICENSE
      - NOTICE
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "audit/**"
      - LICENSE
      - NOTICE
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier format check
        run: pnpm format:check

      - name: Oxlint (fast correctness)
        run: pnpm exec oxlint -c .oxlintrc.json .

      - name: ESLint (type-aware + custom rules)
        run: pnpm lint

      - name: TypeScript strict check (tsc --noEmit)
        run: pnpm typecheck

      - name: Env schema drift check (env.ts vs .env.example)
        run: node scripts/check-env-drift.mjs

      - name: "Action pin check (uses: must be a commit SHA)"
        run: node scripts/check-action-pins.mjs

      - name: Root-file allowlist check
        run: node scripts/check-root-files.mjs

      - name: Knip (dead files, exports, dependencies)
        run: pnpm exec knip

      - name: Vitest unit + integration tests
        run: pnpm test:coverage

      # Wall-clock budgets (replay cost), run alone: see vitest.config.ts and DESIGN.md.
      - name: Vitest performance budgets (run alone)
        run: pnpm test:perf

  # Known-vulnerable dependencies fail the PR. Its own job so a registry hiccup or a new
  # advisory shows as one red check and does not mask the lint, typecheck and test results.
  # The one documented exception lives in pnpm-workspace.yaml (auditConfig).
  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm audit (high and above)
        run: pnpm audit --audit-level=high

  # Builds once for e2e, which downloads the tarball instead of rebuilding. Lighthouse keeps its
  # own build without the GA4 id: the gtag bootstrap cost the homepage performance score. Built with a
  # valid-format but unregistered GA4 id so the real gtag bootstrap renders and the e2e
  # conversion specs can read dataLayer (the specs block googletagmanager.com, so nothing is
  # ever sent). NEXT_PUBLIC_* is inlined at build time, so the id has to be set here.
  # A tarball, not raw paths: upload-artifact drops hidden files (.next) and symlinks.
  build:
    name: Build (standalone artifact for e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GA4_ID: G-E2ETEST000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js production build
        run: pnpm build

      # Reads the client chunks and the first-load manifests the build wrote (see the script's header).
      - name: Bundle budget (Failover game chunks, 420 KB gzip)
        run: node scripts/check-bundle-budget.mjs

      - name: Pack standalone bundle
        run: tar -czf next-build.tgz .next/standalone .next/static public

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tgz
          retention-days: 1
          if-no-files-found: error

  lighthouse:
    name: Lighthouse (all public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Assemble and boot the standalone bundle the same way the Dockerfile
      # does. CI has no secrets, so the boot uses the env gate's designed
      # loud bypass sentinel — Lighthouse audits rendered markup, not the
      # integrations behind the missing vars (DB-backed API calls 500, which
      # only dings the warn-level best-practices category).
      # public/ and .next/static are merged in, like the Dockerfile's COPY
      # layers, never skipped when present: output tracing already puts a
      # partial public/ in the bundle (the icon routes read
      # public/profile.jpg), and an existence check left every other public
      # asset 404ing in CI. The server logs to server.log, shown on failure.
      - name: Boot standalone server
        env:
          DANGEROUSLY_BOOT_WITH_MISSING_REQUIRED_ENV_AND_SKIP_VALIDATION: I_UNDERSTAND_THIS_MAY_CRASH_CORRUPT_DATA_OR_EXPOSE_BROKEN_BEHAVIOR
        run: |
          SERVER_JS=$(find .next/standalone -name server.js -not -path "*/node_modules/*" | head -1)
          APP_DIR=$(dirname "$SERVER_JS")
          mkdir -p "$APP_DIR/.next/static" "$APP_DIR/public"
          cp -r .next/static/. "$APP_DIR/.next/static/"
          cp -r public/. "$APP_DIR/public/"
          PORT=3000 HOSTNAME=127.0.0.1 NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 node "$SERVER_JS" > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health

      - name: Lighthouse audit (URL list derived from sitemap.xml)
        run: node scripts/run-lighthouse.mjs http://localhost:3000

      - name: Server log
        if: failure()
        run: cat server.log

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright, production build)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build

      - name: Unpack standalone bundle
        run: tar -xzf next-build.tgz

      # Same boot as the lighthouse job: the standalone bundle behind the env
      # gate's loud bypass sentinel, since CI has no secrets, with public/
      # and .next/static merged in and the server logging to server.log.
      - name: Boot standalone server
        env:
          DANGEROUSLY_BOOT_WITH_MISSING_REQUIRED_ENV_AND_SKIP_VALIDATION: I_UNDERSTAND_THIS_MAY_CRASH_CORRUPT_DATA_OR_EXPOSE_BROKEN_BEHAVIOR
        run: |
          SERVER_JS=$(find .next/standalone -name server.js -not -path "*/node_modules/*" | head -1)
          APP_DIR=$(dirname "$SERVER_JS")
          mkdir -p "$APP_DIR/.next/static" "$APP_DIR/public"
          cp -r .next/static/. "$APP_DIR/.next/static/"
          cp -r public/. "$APP_DIR/public/"
          PORT=3000 HOSTNAME=127.0.0.1 NODE_ENV=production node "$SERVER_JS" > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health

      # Drives the Google Chrome that ships on ubuntu-latest (channel "chrome"
      # in playwright.config.ts), so no browser download step is needed.
      - name: Playwright E2E
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Server log
        if: failure()
        run: cat server.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # The one place a test talks to a real database: a throwaway Postgres service container
  # that lives and dies with this job. store.db.test.ts refuses any host but localhost or
  # 127.0.0.1 and any database but arcade_it, and never reads DATABASE_URL (AGENTS.md hard
  # boundary, DESIGN.md register). The password below is a throwaway for that container.
  db-integration:
    name: Postgres integration (arcade store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arcade_it
          POSTGRES_PASSWORD: arcade_it_ci_throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arcade_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Arcade store against the service container
        run: pnpm exec vitest run src/lib/arcade/__tests__/store.db.test.ts
        env:
          ARCADE_IT_DATABASE_URL: postgresql://postgres:arcade_it_ci_throwaway@localhost:5432/arcade_it

  deploy:
    name: Deploy to Dokploy
    needs: [lint-and-test, lighthouse, e2e, db-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deploy secrets
        id: check
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          if [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ] && [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::deploy secrets not configured; this push did NOT deploy via CI (Dokploy autoDeploy may still fire independently)"
          fi

      - name: Connect to Tailscale
        if: steps.check.outputs.enabled == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          curl -sf -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"composeId":"hnV_k4WYHOmodXzsvQeDk"}'
