# Security audit: pnpm audit at high/critical plus the stale-override check (an exact
# `overrides` pin that has become a ceiling below a fixed version).
#
# Adapted from the DevinoSolutions org reusable workflow,
# DevinoSolutions/.github .github/workflows/security-audit.yml at commit
# 27fb535cbd0228d069c0d36e6b888a8bcc85e726. It is vendored rather than called because that
# repository is private and this one is owned by a personal account, which GitHub does not
# allow to call it; the composite action it needs is vendored in
# .github/actions/security-audit (see DESIGN.md for the resync recipe).
#
# Kept: the pnpm audit step, the severity report, the override-table audit, the gate, and the
# ignore-advisories input of the action (same format as the org callers).
# Dropped as unneeded here: the inputs (working-directory, package-manager, audit-level,
# audit-flags, install-command, override-audit, fail-on, request-delay, node-version, runner,
# timeout-minutes), the npm, yarn and bun branches with their setup-bun step, the lockfile
# auto-detection, and runner routing (ubuntu-devino / nightly); this repo is a root pnpm
# workspace on ubuntu-latest. The `workflow_call` trigger became `pull_request`.
#
# It sits beside, not instead of, the "Dependency audit (high and critical)" job in ci.yml.
name: security-audit

on:
  pull_request:
    paths:
      - "**"
      - "!audit/**"
      - "!docs/superpowers/**"

concurrency:
  group: security-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main"]'), github.ref) }}

permissions:
  contents: read

jobs:
  security-audit:
    name: Security audit (advisories + override table)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # corepack reads the pinned `packageManager` field in package.json. The version check
      # fails here, where the cause is, instead of later as "no parseable audit JSON".
      - name: Enable corepack
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version

      # The audit exits non-zero whenever it finds something at or above its level, which is
      # information, not a failure to handle here: the exit code is recorded and the JSON is
      # what the report step reads, so the summary is produced either way.
      - name: Run the dependency audit
        id: audit
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/security-audit"
          set +e
          pnpm audit --audit-level=high --json > "$RUNNER_TEMP/security-audit/audit.json" 2> "$RUNNER_TEMP/security-audit/audit.err"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "audit exited $code, $(wc -c < "$RUNNER_TEMP/security-audit/audit.json") bytes of JSON"
          if [ ! -s "$RUNNER_TEMP/security-audit/audit.json" ]; then
            echo "::warning::the audit produced no stdout; stderr follows"
            cat "$RUNNER_TEMP/security-audit/audit.err" || true
          fi

      - name: Summarise the dependency audit
        id: report
        continue-on-error: true
        uses: ./.github/actions/security-audit
        with:
          mode: report
          audit-json: ${{ runner.temp }}/security-audit/audit.json
          package-manager: pnpm
          audit-command: pnpm audit --audit-level=high --json
          audit-exit: ${{ steps.audit.outputs.exit }}
          fail-on: critical,high
          json-out: ${{ runner.temp }}/security-audit/report.json

      - name: Audit the override / resolutions table
        id: overrides
        continue-on-error: true
        uses: ./.github/actions/security-audit
        with:
          mode: overrides
          root: .
          fail-on: critical,high
          json-out: ${{ runner.temp }}/security-audit/overrides.json

      # Both checks run to completion before anything fails, so one summary carries both
      # tables.
      - name: Gate
        env:
          REPORT: ${{ steps.report.outcome }}
          OVERRIDES: ${{ steps.overrides.outcome }}
        run: |
          set -euo pipefail
          echo "dependency audit: $REPORT"
          echo "override audit:   $OVERRIDES"
          failed=0
          if [ "$REPORT" = "failure" ]; then failed=1; fi
          if [ "$OVERRIDES" = "failure" ]; then failed=1; fi
          if [ "$failed" = "1" ]; then
            echo "::error::security audit failed - see the job summary for the severity table and the stale override rows"
            exit 1
          fi
          echo "clean: nothing at or above critical,high, and no override entry admits a vulnerable version"
