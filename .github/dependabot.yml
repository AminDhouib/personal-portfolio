# Dependabot keeps the SHA-pinned GitHub Actions and npm dependencies from
# rotting: pins never move on their own, so without an updater they stay
# frozen (and unpatched) forever. PRs still go through the full CI gate sweep.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Updates the pinned SHA and keeps the trailing `# vN` comment that
    # scripts/check-action-pins.mjs relies on for human readability.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node must match the Node major we run (Dockerfile and .nvmrc, 22).
      # Types for a newer major describe APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # @ai-sdk/openai 4 builds LanguageModelV4 models. @copilotkit/runtime 1.77.x
      # bundles ai 6, which accepts only spec v2/v3 models, so the chat route stops
      # typechecking and would break at runtime. Revisit when CopilotKit's runtime
      # moves to ai 7.
      - dependency-name: "@ai-sdk/openai"
        update-types:
          - version-update:semver-major
