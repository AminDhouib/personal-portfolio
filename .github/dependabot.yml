# Dependabot keeps the SHA-pinned GitHub Actions and npm dependencies from
# rotting: pins never move on their own, so without an updater they stay
# frozen (and unpatched) forever. PRs still go through the full CI gate sweep.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A new release waits two days before a version update considers it. This does not
    # apply to security updates.
    cooldown:
      default-days: 2
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # @types/node must match the Node major we run (Dockerfile and .nvmrc, 22).
      # Types for a newer major describe APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # @ai-sdk/openai 4 builds LanguageModelV4 models. @copilotkit/runtime 1.77.x
      # bundles ai 6, which accepts only spec v2/v3 models, so the chat route stops
      # typechecking and would break at runtime. Revisit when CopilotKit's runtime
      # moves to ai 7.
      - dependency-name: "@ai-sdk/openai"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Updates the pinned SHA and keeps the trailing `# vN` comment that
    # scripts/check-action-pins.mjs relies on for human readability.
    groups:
      actions:
        patterns:
          - "*"

  # The root Dockerfile (node base image, pinned by tag and digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # compose.yml pins the postgres image.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
